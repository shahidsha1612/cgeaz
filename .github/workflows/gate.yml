name: compliance-gate

# The pipeline enforces policy on your environment. This gate enforces policy on the
# pipeline. No governance change merges without passing the same kind of scrutiny the
# pipeline applies to everything else.

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write   # OIDC federation — no client secret stored in GitHub, nothing to rotate
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
  TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}

jobs:
  gate:
    # Runs only in forks that have been armed (Lab 6: labs/06-loop/arm-your-fork.sh).
    # The upstream GRCEngClub/cgeaz repo is deliberately NOT armed: on a public repo,
    # a pull_request OIDC subject matches PRs from any fork — arming upstream would
    # hand fork PRs a path toward the course subscription. Your fork, your identity,
    # your sandbox subscription only.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one stage's failure must not hide another stage's verdict
      matrix:
        stage: [01-foundation, 03-evidence-store, 04-reporting, 06-enforcement]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: write backend config from repo variables
        # labs/03-foundation/backend.hcl is gitignored (machine-generated per learner),
        # so a CI checkout never has it; rebuild it from the STATE_STORAGE_ACCOUNT variable.
        run: |
          printf 'resource_group_name  = "rg-grc-tfstate"\nstorage_account_name = "%s"\ncontainer_name       = "tfstate"\n' \
            "${{ vars.STATE_STORAGE_ACCOUNT }}" > labs/03-foundation/backend.hcl

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform validate + plan
        working-directory: stages/${{ matrix.stage }}
        run: |
          set -o pipefail
          terraform init -input=false -no-color -backend-config=../../labs/03-foundation/backend.hcl 2>&1 | tee init.log
          terraform validate -no-color
          if ! terraform plan -input=false -no-color -out=tf.plan > plan.log 2>&1; then
            cat plan.log
            # Surface the error as an annotation so the verdict is readable on the PR itself.
            msg=$(grep -A4 '^Error' plan.log | head -20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=terraform plan failed (${{ matrix.stage }})::${msg}"
            exit 1
          fi
          tail -3 plan.log
          terraform show -json tf.plan > plan.json

      # Pinned, current conftest. The previous instrumenta/conftest-action@master
      # shipped an OPA too old to parse `import rego.v1`, so every stage "failed"
      # on a parse error rather than on a policy verdict.
      - name: install conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest
          conftest --version

      - name: OPA gate (conftest)
        run: conftest test stages/${{ matrix.stage }}/plan.json -p policy --output github
